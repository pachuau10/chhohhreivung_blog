{% if article %}
<a href="https://www.facebook.com/sharer/sharer.php?u={{ request.build_absolute_uri }}"
   class="share-pill share-pill-facebook" target="_blank" rel="noopener noreferrer" aria-label="Share on Facebook">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
    <span>Facebook</span>
</a>
<a href="https://twitter.com/intent/tweet?text={{ article.title }}&url={{ request.build_absolute_uri }}"
   class="share-pill share-pill-twitter" target="_blank" rel="noopener noreferrer" aria-label="Share on Twitter">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
    <span>X</span>
</a>
<a href="https://www.linkedin.com/shareArticle?mini=true&url={{ request.build_absolute_uri }}&title={{ article.title }}"
   class="share-pill share-pill-linkedin" target="_blank" rel="noopener noreferrer" aria-label="Share on LinkedIn">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg>
    <span>LinkedIn</span>
</a>
<a href="https://api.whatsapp.com/send?text={{ article.title }}%20{{ request.build_absolute_uri }}"
   class="share-pill share-pill-whatsapp" target="_blank" rel="noopener noreferrer" aria-label="Share on WhatsApp">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    <span>WhatsApp</span>
</a>
<button class="share-pill share-pill-copy" id="copyLinkBtn" aria-label="Copy link">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
    <span>Copy</span>
</button>
{% endif %}
